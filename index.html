<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dairy CRM - Shri Khatu Shyam Dairy</title>
    <style>
        /* Basic styling for layout consistency */
        body { font-family: Arial, sans-serif; margin: 0; background: #e0f2fe; }
        .dashboard-card { background: #9333ea; color: white; padding: 20px; border-radius: 12px; display: inline-block; min-width: 200px; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f1f5f9; color: #333; }
        .btn-edit { background: #0d9488; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .btn-edit:hover { background: #0f766e; }
        /* Modal styling */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 300px; }
        .modal-content input { width: 100%; padding: 8px; margin: 10px 0; box-sizing: border-box; }
        .modal-buttons { text-align: right; }
        .modal-buttons button { padding: 5px 10px; margin-left: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- 1. Dashboard Pending Amount Card -->
    <div style="padding: 20px;">
        <div class="dashboard-card" id="dashboardPendingCard">
            <div style="font-size: 14px;">Pending Amount</div>
            <div id="totalPendingAmountDisplay" style="font-size: 24px; font-weight: bold; margin-top: 5px;">₹ 0.00</div>
        </div>
    </div>

    <!-- 2. Pending Customers Table -->
    <div style="padding: 20px;">
        <h3>All Pending Customers & Payment Dues</h3>
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Module / Type</th>
                    <th>Customer Name</th>
                    <th>Mobile</th>
                    <th>Details</th>
                    <th>Pending Amount</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="pendingCustomersTableBody">
                <!-- Data dynamically populated via JS -->
            </tbody>
        </table>
    </div>

    <!-- Partial Payment Modal -->
    <div id="paymentModal" class="modal">
        <div class="modal-content">
            <h4>Update Payment</h4>
            <p>Current Pending: <span id="modalCurrentPending"></span></p>
            <label>Enter Paid Amount:</label>
            <input type="number" id="inputPaidAmount" placeholder="Amount jama karein">
            <div class="modal-buttons">
                <button onclick="closeModal()">Cancel</button>
                <button onclick="submitPartialPayment()" style="background: #0d9488; color: white; border: none; border-radius: 4px;">Save</button>
            </div>
        </div>
    </div>

    <script>
        // Sample Customer Data (Aapke purane database/array se replace kar lein)
        let customersData = [
            { id: 1, date: '2026-09-18', type: 'Cattle Sell', name: 'Shyamlal Traders', mobile: '9988776655', details: 'Milking Cow (Tag: 1235)', pendingAmount: 1200000.00 },
            { id: 2, date: '2026-09-18', type: 'Cattle Sell', name: 'Kishan Singh', mobile: '9811223344', details: 'Milking Cow (Tag: 12356)', pendingAmount: 1200000.00 }
        ];

        let activeCustomerId = null;

        // Render Table and Update Dashboard Total
        function renderCRMData() {
            let tbody = document.getElementById('pendingCustomersTableBody');
            tbody.innerHTML = '';
            let totalPendingSum = 0;

            customersData.forEach(customer => {
                if (customer.pendingAmount > 0) {
                    totalPendingSum += customer.pendingAmount;

                    let row = `<tr>
                        <td>${customer.date}</td>
                        <td>${customer.type}</td>
                        <td><b>${customer.name}</b></td>
                        <td>${customer.mobile}</td>
                        <td>${customer.details}</td>
                        <td>₹ ${customer.pendingAmount.toLocaleString('en-IN', {minimumFractionDigits: 2})}</td>
                        <td><button class="btn-edit" onclick="openPaymentModal(${customer.id})">Edit / Pay</button></td>
                    </tr>`;
                    tbody.innerHTML += row;
                }
            });

            // Update Dashboard Total Pending Amount Card
            document.getElementById('totalPendingAmountDisplayinnerText').innerText = '';
            document.getElementById('totalPendingAmountDisplay').innerText = '₹ ' + totalPendingSum.toLocaleString('en-IN', {minimumFractionDigits: 2});
        }

        // Open Modal for Partial Payment
        function openPaymentModal(id) {
            activeCustomerId = id;
            let customer = customersData.find(c => c.id === id);
            if (customer) {
                document.getElementById('modalCurrentPending').innerText = '₹ ' + customer.pendingAmount.toLocaleString('en-IN', {minimumFractionDigits: 2});
                document.getElementById('inputPaidAmount').value = '';
                document.getElementById('paymentModal').style.display = 'flex';
            }
        }

        // Close Modal
        function closeModal() {
            document.getElementById('paymentModal').style.display = 'none';
            activeCustomerId = null;
        }

        // Submit and Calculate Partial Payment
        function submitPartialPayment() {
            let paidInput = parseFloat(document.getElementById('inputPaidAmount').value);
            let customer = customersData.find(c => c.id === activeCustomerId);

            if (isNaN(paidInput) || paidInput <= 0) {
                alert('Kripya valid amount enter karein!');
                return;
            }

            if (paidInput > customer.pendingAmount) {
                alert('Jama kiya gaya amount total pending amount se zyada nahi ho sakta!');
                return;
            }

            // Calculation: New Pending = Old Pending - Paid Amount
            customer.pendingAmount -= paidInput;

            closeModal();
            renderCRMData(); // Refresh list and dashboard total
        }

        // Initial Load
        window.onload = function() {
            renderCRMData();
        };
    </script>
</body>
</html>
