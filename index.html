<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Dairy Billing - Tiwari & Son's</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #7dd3fc 0%, #0284c7 100%); color: #1e293b; min-height: 100vh; }
        .card-box { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="p-4 md:p-8 font-sans">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="card-box p-6 rounded-3xl flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-extrabold text-pink-600 flex items-center">
                    <i class="fa-solid fa-cow mr-3"></i> Tiwari & Son's Bulk Dairy Billing
                </h1>
                <p class="text-xs text-slate-500 mt-1">Head Office: Tingajpur, M.P. | Helpline: +91 9752266047</p>
            </div>
            <div class="w-full md:w-auto flex gap-2">
                <input type="text" id="sheetUrlInput" placeholder="Paste Google Apps Script Web App URL..." class="border border-slate-300 rounded-xl px-3 py-2 text-xs w-full md:w-72">
                <button onclick="saveUrl()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition">Save URL</button>
            </div>
        </div>

        <!-- Bulk Dairy Entry Form -->
        <div class="card-box p-6 rounded-3xl space-y-4">
            <h2 class="text-lg font-bold text-slate-800 border-b pb-2"><i class="fa-solid fa-industry mr-2 text-pink-600"></i> New Milk Entry & Auto Calculation</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
                <div>
                    <label class="block font-medium text-slate-700 mb-1">Date:</label>
                    <input type="date" id="billDate" class="w-full border rounded-xl p-3 bg-white">
                </div>
                <div>
                    <label class="block font-medium text-slate-700 mb-1">Shift:</label>
                    <select id="billShift" class="w-full border rounded-xl p-3 bg-white">
                        <option value="Morning">Morning (सुबह)</option>
                        <option value="Evening">Evening (शाम)</option>
                    </select>
                </div>
                <div>
                    <label class="block font-medium text-slate-700 mb-1">Milk Type:</label>
                    <select id="milkType" class="w-full border rounded-xl p-3 bg-white">
                        <option value="Cow Milk">Cow Milk (गाय का दूध)</option>
                        <option value="Buffalo Milk">Buffalo Milk (भैंस का दूध)</option>
                    </select>
                </div>
                <div>
                    <label class="block font-medium text-slate-700 mb-1">Quantity (Liters):</label>
                    <input type="number" id="milkQty" placeholder="e.g. 50" oninput="calculateBilling()" class="w-full border rounded-xl p-3 bg-white">
                </div>
                <div>
                    <label class="block font-medium text-slate-700 mb-1">FAT %:</label>
                    <input type="number" step="0.1" id="milkFat" placeholder="e.g. 6.0" oninput="calculateBilling()" class="w-full border rounded-xl p-3 bg-white">
                </div>
                <div>
                    <label class="block font-medium text-slate-700 mb-1">Fat Rate (₹):</label>
                    <input type="number" step="0.5" id="fatRate" placeholder="e.g. 10" oninput="calculateBilling()" class="w-full border rounded-xl p-3 bg-white">
                </div>
                <div>
                    <label class="block font-medium text-slate-700 mb-1">SNF / CLR:</label>
                    <input type="number" step="0.1" id="milkSnf" placeholder="e.g. 8.5" class="w-full border rounded-xl p-3 bg-white">
                </div>
                <div>
                    <label class="block font-medium text-slate-700 mb-1">Rate per Liter (Auto):</label>
                    <input type="text" id="perLiterRate" placeholder="Auto Calculated" class="w-full border rounded-xl p-3 bg-purple-50 text-purple-700 font-bold" readonly>
                </div>
                <div>
                    <label class="block font-medium text-slate-700 mb-1">Total Amount (Auto):</label>
                    <input type="text" id="totalAmount" placeholder="Auto Calculated" class="w-full border rounded-xl p-3 bg-pink-50 text-pink-600 font-bold" readonly>
                </div>
                <div>
                    <label class="block font-medium text-slate-700 mb-1">Dairy / Party Name:</label>
                    <input type="text" id="partyName" placeholder="e.g. Shyamlal Traders" class="w-full border rounded-xl p-3 bg-white">
                </div>
                <div>
                    <label class="block font-medium text-slate-700 mb-1">Mobile Number:</label>
                    <input type="text" id="mobileNum" value="9752266047" class="w-full border rounded-xl p-3 bg-white">
                </div>
                <div>
                    <label class="block font-medium text-slate-700 mb-1">Payment Status:</label>
                    <select id="paymentStatus" class="w-full border rounded-xl p-3 bg-white">
                        <option value="Pending">Pending (बाकी)</option>
                        <option value="Paid">Paid (चुक्ता)</option>
                    </select>
                </div>
            </div>

            <div class="pt-3">
                <button onclick="saveAndSyncEntry()" class="bg-gradient-to-r from-pink-600 to-purple-600 text-white font-bold px-8 py-3.5 rounded-xl shadow-lg hover:opacity-90 transition w-full md:w-auto">
                    <i class="fa-solid fa-cloud-arrow-up mr-2"></i> Save & Send to Google Sheet
                </button>
            </div>
        </div>

    </div>

    <script>
        let calcRate = 0;
        let calcTotal = 0;

        window.onload = function() {
            document.getElementById('billDate').valueAsDate = new Date();
            let savedUrl = localStorage.getItem('dairy_sheet_url') || '';
            if(savedUrl) document.getElementById('sheetUrlInput').value = savedUrl;
        };

        function saveUrl() {
            let url = document.getElementById('sheetUrlInput').value.trim();
            localStorage.setItem('dairy_sheet_url', url);
            alert("Google Sheet URL saved successfully!");
        }

        function calculateBilling() {
            let qty = parseFloat(document.getElementById('milkQty').value) || 0;
            let fat = parseFloat(document.getElementById('milkFat').value) || 0;
            let fatRate = parseFloat(document.getElementById('fatRate').value) || 0;

            calcRate = fat * fatRate;
            calcTotal = qty * calcRate;

            document.getElementById('perLiterRate').value = calcRate.toFixed(2);
            document.getElementById('totalAmount').value = calcTotal.toFixed(2);
        }

        function saveAndSyncEntry() {
            let url = localStorage.getItem('dairy_sheet_url') || document.getElementById('sheetUrlInput').value.trim();
            if(!url) {
                alert("Please enter and save your Google Sheet Web App URL first!");
                return;
            }

            let payload = {
                module: "Bulk Dairy",
                date: document.getElementById('billDate').value,
                shift: document.getElementById('billShift').value,
                milkType: document.getElementById('milkType').value,
                qty: parseFloat(document.getElementById('milkQty').value) || 0,
                fat: parseFloat(document.getElementById('milkFat').value) || 0,
                fatRate: parseFloat(document.getElementById('fatRate').value) || 0,
                snf: document.getElementById('milkSnf').value || '0',
                ratePerL: calcRate,
                totalAmt: calcTotal,
                party: document.getElementById('partyName').value.trim(),
                mobile: document.getElementById('mobileNum').value.trim(),
                status: document.getElementById('paymentStatus').value
            };

            if(!payload.party || payload.qty <= 0) {
                alert("Please fill Party Name and Quantity!");
                return;
            }

            // Sending data via fetch POST to Google Apps Script
            fetch(url, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(() => {
                alert("Data successfully sent to Google Sheet!");
                // Clear form quantities
                document.getElementById('milkQty').value = '';
                document.getElementById('milkFat').value = '';
                document.getElementById('fatRate').value = '';
                document.getElementById('milkSnf').value = '';
                document.getElementById('perLiterRate').value = '';
                document.getElementById('totalAmount').value = '';
            })
            .catch(err => {
                console.error(err);
                alert("Error sending data. Check console or URL.");
            });
        }
    </script>
</body>
</html>
